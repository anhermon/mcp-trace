name: CI

on:
  push:
    branches: [main, dev]
    # Without this the release job below can never run: its
    # `if: startsWith(github.ref, 'refs/tags/v')` guard is false on branch pushes.
    tags: ['v*']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # ── go mod tidy check ────────────────────────────────────────────────────────
  tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify go.sum is up to date
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || {
            echo "::error::go.mod/go.sum is out of date. Run 'go mod tidy' and commit the result."
            exit 1
          }

  # ── Sanity: vet + build ──────────────────────────────────────────────────────
  build:
    name: Build & vet
    needs: [tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Vet
        run: task vet

      - name: Build
        run: task build

  # ── Tests with race detector ────────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go }})
    needs: [tidy]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test with coverage
        run: task test:cover

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.go == '1.22'
        with:
          name: coverage-report
          path: coverage.html

  # ── Lint ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: [tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pinned: 'latest' silently jumped to v2 and rejected the v1 config.
          version: v2.12.2

  # ── Branch sanity guard ──────────────────────────────────────────────────────
  # Prevents direct merges from feature branches to main (must go through dev).
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Require dev as merge source
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs to main must come from the 'dev' branch. Got: ${{ github.head_ref }}"
            exit 1
          fi

  # ── Cross-compile release ────────────────────────────────────────────────────
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cross-compile
        run: task release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ── Publish container image to ghcr.io ───────────────────────────────────────
  # Same tag guard as `release` above, which is known to fire: the v1.0.1 tag
  # push ran this workflow and the Release job completed (run 30211256568).
  docker-publish:
    name: Publish image (ghcr.io)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Explicit: the demo stage must never be published as mcp-trace.
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
